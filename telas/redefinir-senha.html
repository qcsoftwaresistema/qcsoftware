<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Q.C Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .bg-industrial {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                              url('/telas/imagens/background_login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-industrial min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        
        <div class="flex flex-col items-center mb-6">
            <img src="/telas/imagens/logo.png" alt="Q.C Software Logo" class="h-20 w-auto object-contain mb-2">
            <h1 class="text-xl font-bold text-slate-800">Crie sua Nova Senha</h1>
            <p class="text-xs text-slate-500 text-center mt-1">Digite sua nova senha de acesso abaixo.</p>
        </div>

        <div id="msg-sucesso" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg flex items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span>Senha alterada com sucesso! Redirecionando para o login...</span>
        </div>

        <div id="msg-erro" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg flex items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="texto-erro">Erro ao alterar a senha.</span>
        </div>

        <form id="form-redefinir" onsubmit="salvarNovaSenha(event)" class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail de Acesso</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="email-usuario" readonly disabled
                        class="w-full pl-10 pr-3 py-2 border border-slate-200 bg-slate-100 text-slate-500 rounded-lg text-sm focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nova Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="nova-senha" required minlength="6" placeholder="Mínimo de 6 caracteres"
                        class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Confirmar Nova Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <input type="password" id="confirmar-senha" required minlength="6" placeholder="Repita a nova senha"
                        class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <button type="submit" id="btn-salvar"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow transition-colors flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="bi bi-check-lg"></i> Alterar Senha
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <a href="login.html" class="text-xs text-blue-600 hover:underline font-medium">
                <i class="bi bi-arrow-left"></i> Voltar para o Login
            </a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes("qcsoftware.com.br")
            ? "/api" 
            : "https://sistema.qcsoftware.com.br";

        // Extrai o parâmetro "email" da URL no carregamento da página
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');

        document.addEventListener("DOMContentLoaded", () => {
            const inputEmail = document.getElementById("email-usuario");
            if (emailParam) {
                inputEmail.value = emailParam;
            } else {
                exibirErro("Link de redefinição inválido ou sem e-mail associado.");
                document.getElementById("btn-salvar").disabled = true;
            }
        });

        function exibirErro(mensagem) {
            const msgErro = document.getElementById("msg-erro");
            const textoErro = document.getElementById("texto-erro");
            textoErro.innerText = mensagem;
            msgErro.classList.remove("hidden");
        }

        async function salvarNovaSenha(e) {
            e.preventDefault();

            const novaSenha = document.getElementById("nova-senha").value.trim();
            const confirmarSenha = document.getElementById("confirmar-senha").value.trim();
            const msgSucesso = document.getElementById("msg-sucesso");
            const msgErro = document.getElementById("msg-erro");
            const btnSalvar = document.getElementById("btn-salvar");

            msgSucesso.classList.add("hidden");
            msgErro.classList.add("hidden");

            // Validação de correspondência de senhas no Frontend
            if (novaSenha !== confirmarSenha) {
                exibirErro("As senhas não coincidem. Por favor, verifique.");
                return;
            }

            btnSalvar.disabled = true;
            btnSalvar.innerHTML = `<i class="bi bi-arrow-repeat animate-spin"></i> Atualizando...`;

            try {
                const res = await fetch(`${API_BASE}/confirmar-redefinicao`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: emailParam,
                        nova_senha: novaSenha
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    msgSucesso.classList.remove("hidden");
                    document.getElementById("form-redefinir").reset();
                    
                    // Redireciona para o login após 2.5 segundos
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2500);
                } else {
                    throw new Error(data.detail || "Não foi possível redefinir sua senha.");
                }
            } catch (err) {
                exibirErro(err.message || "Erro ao conectar com o servidor.");
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = `<i class="bi bi-check-lg"></i> Alterar Senha`;
            }
        }
    </script>
</body>
</html>
