<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Q.C Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Imagem de Fundo Industrial com Overlay Escuro */
        .bg-industrial {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                              url('/telas/imagens/background_login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-industrial min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
        
        <div class="flex flex-col items-center mb-6">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 mb-3">
                <img src="/telas/imagens/logo.png" alt="Q.C Software Logo" class="h-16 w-auto object-contain" onerror="this.src='logo.png'">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Acesso ao Sistema</h1>
            <p class="text-xs text-slate-500 mt-1">Digite seu usuário e senha</p>
        </div>

        <div id="msg-erro" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg flex items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="texto-erro">Usuário ou senha incorretos!</span>
        </div>

        <form id="form-login" onsubmit="autenticarUsuario(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuário</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="login-usuario" required placeholder="Digite seu usuário"
                        class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 bg-white">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Senha</label>
                    <a href="recuperarsenha.html" class="text-xs text-blue-600 hover:underline font-semibold">
                        Esqueceu sua senha?
                    </a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="login-senha" required placeholder="••••••••"
                        class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 bg-white">
                </div>
            </div>

            <button type="submit" id="btn-entrar"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2 cursor-pointer mt-2 text-sm">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-200/60 pt-4">
            <span class="text-[11px] text-slate-400 font-medium">&copy; Q.C Software - Agilidade que gera resultados.</span> <br>
            <span class="text-[11px] text-slate-400 font-medium">Todos os direitos reservados - versão 1.0.</span>
        </div>
    </div>

    <script>
        // URL direta para buscar a lista de usuários da API
        const API_USUARIOS_URL = "https://sistema.qcsoftware.com.br/usuarios/";
        const API_BASE_PERMISSOES = "https://sistema.qcsoftware.com.br/permissoes/perfil/";

        async function autenticarUsuario(e) {
            e.preventDefault();
            
            const usuarioInput = document.getElementById("login-usuario").value.trim();
            const senhaInput = document.getElementById("login-senha").value;
            const msgErro = document.getElementById("msg-erro");
            const textoErro = document.getElementById("texto-erro");
            const btnEntrar = document.getElementById("btn-entrar");

            msgErro.classList.add("hidden");
            btnEntrar.disabled = true;
            btnEntrar.innerHTML = `<i class="bi bi-arrow-repeat animate-spin"></i> Autenticando...`;

            try {
                // Busca a lista diretamente do endpoint /usuarios/
                const res = await fetch(API_USUARIOS_URL);
                
                if (!res.ok) {
                    throw new Error("Não foi possível conectar ao servidor de usuários.");
                }

                const usuarios = await res.json();
                
                // Encontra o usuário cadastrado (insensível a maiúsculas/minúsculas)
                const userEncontrado = usuarios.find(u => 
                    (u.usuario && u.usuario.toLowerCase() === usuarioInput.toLowerCase()) ||
                    (u.login && u.login.toLowerCase() === usuarioInput.toLowerCase())
                );

                if (!userEncontrado) {
                    throw new Error("Usuário não encontrado.");
                }

                // Valida a senha (suporta chave 'senha' ou 'senha_hash')
                const senhaCadastrada = userEncontrado.senha || userEncontrado.senha_hash || userEncontrado.password;
                if (senhaCadastrada && senhaCadastrada !== senhaInput) {
                    throw new Error("Senha incorreta.");
                }

                // Carrega as permissões vinculadas ao perfil (caso existam)
                let permissoes = [];
                const idPerfil = userEncontrado.id_perfis || userEncontrado.id_perfil;
                if (idPerfil) {
                    try {
                        const resPerms = await fetch(`${API_BASE_PERMISSOES}${idPerfil}`);
                        if (resPerms.ok) permissoes = await resPerms.json();
                    } catch (e) {
                        console.warn("Permissões não puderam ser carregadas:", e);
                    }
                }

                // Armazena dados na sessão
                sessionStorage.setItem("qc_user", JSON.stringify({
                    id_usuarios: userEncontrado.id_usuarios || userEncontrado.id,
                    usuario: userEncontrado.usuario || userEncontrado.login,
                    id_perfis: idPerfil,
                    nome_perfil: userEncontrado.nome_perfil || userEncontrado.perfil || "Usuário",
                    permissoes: permissoes
                }));

                // Redireciona para a página de ocorrências
                window.location.href = "/telas/ocorrencias.html";

            } catch (err) {
                textoErro.innerText = err.message || "Erro ao efetuar login.";
                msgErro.classList.remove("hidden");
            } finally {
                btnEntrar.disabled = false;
                btnEntrar.innerHTML = `<i class="bi bi-box-arrow-in-right"></i> Entrar`;
            }
        }

        // Se já houver sessão ativa, redireciona direto para a página de ocorrências
        if (sessionStorage.getItem("qc_user")) {
            window.location.href = "/telas/ocorrencias.html";
        }
    </script>
</body>
</html>
