<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Q.C Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .bg-industrial {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                              url('/telas/imagens/background_login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-industrial min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
        
        <div class="flex flex-col items-center mb-6">
            <img src="/telas/imagens/logo.png" alt="Q.C Software Logo" class="h-20 w-auto object-contain mb-2">
            <h1 class="text-xl font-bold text-slate-800">Recuperação de Senha</h1>
            <p class="text-xs text-slate-500 text-center mt-1">Informe seu e-mail cadastrado para receber as instruções de redefinição.</p>
        </div>

        <div id="msg-sucesso" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg flex items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span id="texto-sucesso">Enviamos um e-mail com as instruções para redefinir sua senha!</span>
        </div>

        <div id="msg-erro" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg flex items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="texto-erro">E-mail não encontrado!</span>
        </div>

        <form id="form-recuperar" onsubmit="enviarEmailRecuperacao(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail Cadastrado</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="email-recuperar" required placeholder="seuemail@empresa.com"
                        class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <button type="submit" id="btn-enviar"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow transition-colors flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="bi bi-send"></i> Enviar Link de Recuperação
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <a href="login.html" class="text-xs text-blue-600 hover:underline font-medium">
                <i class="bi bi-arrow-left"></i> Voltar para o Login
            </a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes("qcsoftware.com.br")
            ? "/api" 
            : "https://sistema.qcsoftware.com.br";

        async function enviarEmailRecuperacao(e) {
            e.preventDefault();
            
            const email = document.getElementById("email-recuperar").value.trim();
            const msgSucesso = document.getElementById("msg-sucesso");
            const textoSucesso = document.getElementById("texto-sucesso");
            const msgErro = document.getElementById("msg-erro");
            const textoErro = document.getElementById("texto-erro");
            const btnEnviar = document.getElementById("btn-enviar");

            msgSucesso.classList.add("hidden");
            msgErro.classList.add("hidden");
            btnEnviar.disabled = true;
            btnEnviar.innerHTML = `<i class="bi bi-arrow-repeat animate-spin"></i> Enviando...`;

            try {
                // Chamada enviando POST para a nova rota /recuperar-senha
                const res = await fetch(`${API_BASE}/recuperar-senha`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const data = await res.json();

                if (res.ok) {
                    textoSucesso.innerText = data.message || "Instruções enviadas com sucesso!";
                    msgSucesso.classList.remove("hidden");
                    document.getElementById("form-recuperar").reset();
                } else {
                    throw new Error(data.detail || "E-mail não cadastrado em nosso sistema.");
                }
            } catch (err) {
                textoErro.innerText = err.message || "Erro ao conectar com o servidor.";
                msgErro.classList.remove("hidden");
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = `<i class="bi bi-send"></i> Enviar Link de Recuperação`;
            }
        }
    </script>
</body>
</html>
